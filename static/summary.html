<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สรุปยอดใบกำกับภาษี</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f8fafc; --surface-3: #f1f4f8;
    --text: #10131a; --text-2: #3c4453; --muted: #6b7280;
    --border: #e8ebf0;
    --blue: #0b5fff; --blue-hover: #0a4fd6; --blue-soft: #e9f0ff; --on-blue: #ffffff;
    --green: #12a35f; --green-soft: #e6f7ef;
    --amber: #b45309; --amber-soft: #fef3c7;
    --grid: #eef1f6;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --shadow-md: 0 4px 14px rgba(16,24,40,.08);
    --r: 14px; --r-sm: 11px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Leelawadee UI", "Noto Sans Thai", "IBM Plex Sans Thai", "Segoe UI", system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 0 16px 60px; }

  .page-head { padding: 22px 0 16px; display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .page-head h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 3px; letter-spacing: -.02em; }
  .page-head p { margin: 0; color: var(--muted); font-size: 0.86rem; }
  .page-head .spacer { flex: 1; }

  .btn {
    font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    border-radius: var(--r-sm); padding: 10px 16px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-2); text-decoration: none; display: inline-block;
  }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn-primary { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
  .btn-primary:hover { background: var(--blue-hover); color: var(--on-blue); }

  /* ── ตัวเลขสรุป (hero numbers) ── */
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); margin-bottom: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
  .tile .cap { font-size: 0.76rem; color: var(--muted); }
  .tile .val { font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
  .tile .sub { font-size: 0.73rem; color: var(--muted); }
  .tile.warn .val { color: var(--amber); }

  /* ── การ์ดกราฟ ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .card-head h2 { font-size: 1rem; font-weight: 700; margin: 0; }
  .card-head .note { font-size: 0.78rem; color: var(--muted); }
  .card-head .spacer { flex: 1; }
  select {
    font-family: inherit; font-size: 0.85rem; padding: 7px 10px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }

  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; }
  .bar { fill: var(--blue); }
  .sel-mark { fill: var(--blue); }
  .bar-hit { fill: transparent; cursor: pointer; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-base { stroke: var(--border); stroke-width: 1; }
  .tick-lbl { fill: var(--muted); font-size: 11px; }
  .cat-lbl  { fill: var(--text-2); font-size: 11.5px; }
  .cat-lbl.on { fill: var(--blue); font-weight: 700; }
  .peak-lbl { fill: var(--text); font-size: 11px; font-weight: 700; }

  .tooltip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: #10131a; color: #fff; border-radius: 9px; padding: 8px 11px;
    font-size: 0.78rem; line-height: 1.45; white-space: nowrap; z-index: 5;
    transform: translate(-50%, -100%);
  }
  .tooltip.on { opacity: 1; }
  .tooltip b { font-size: 0.88rem; }

  .empty { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 40px 16px; }
  .toggle-table { background: none; border: none; color: var(--blue); font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 6px 0 0; }
  table.data { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 10px; display: none; }
  table.data.show { display: table; }
  table.data th, table.data td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--muted); font-weight: 600; font-size: 0.75rem; }
</style>
</head>
<body>
<div class="wrap">

  <div class="page-head">
    <div>
      <h1>สรุปยอดใบกำกับภาษี</h1>
      <p id="sub">ยอดรวมรายเดือนและรายปี จากใบที่บันทึกไว้ในระบบ</p>
    </div>
    <div class="spacer"></div>
    <a class="btn" href="/">← กลับหน้าสกัดข้อมูล</a>
  </div>

  <div id="content" style="display:none">
    <div class="tiles" id="tiles"></div>

    <div class="card">
      <div class="card-head">
        <h2>ยอดรวมรายปี</h2>
        <span class="note">คลิกที่แท่งเพื่อดูรายเดือนของปีนั้น</span>
      </div>
      <div class="chart" id="chartYear"><div class="tooltip" id="tipYear"></div></div>
      <button class="toggle-table" data-for="tblYear">แสดงเป็นตาราง</button>
      <table class="data" id="tblYear"></table>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>ยอดรวมรายเดือน</h2>
        <span class="spacer"></span>
        <select id="yearSel"></select>
      </div>
      <div class="chart" id="chartMonth"><div class="tooltip" id="tipMonth"></div></div>
      <button class="toggle-table" data-for="tblMonth">แสดงเป็นตาราง</button>
      <table class="data" id="tblMonth"></table>
    </div>
  </div>

  <div class="empty" id="empty" style="display:none">
    ยังไม่มีใบกำกับภาษีในฐานข้อมูล<br>
    ไปที่หน้าสกัดข้อมูล อ่านใบแล้วกด <b>บันทึก</b> ข้อมูลจะขึ้นมาสรุปที่นี่<br><br>
    <a class="btn btn-primary" href="/">ไปหน้าสกัดข้อมูล</a>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

// ' ' = ช่องว่างบาง -- ฟอนต์ไทยหลายตัววาง ฿ ชิดตัวเลขจนดูซ้อนกัน
const baht = n => '฿ ' + n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/**
 * ย่อตัวเลขบนแกน -- ยอดใบกำกับมักเป็นหลักล้าน ถ้าเขียนเต็มแกนจะรก
 * ต้องเลือกหน่วยจาก "ค่าสูงสุดของแกน" แล้วใช้หน่วยเดียวกันทั้งแกน
 * (ถ้าย่อทีละตัว จะได้แกนที่ปน "2 ล้าน" กับ "500k" อ่านเทียบกันยาก)
 */
function axisFmt(max) {
  if (max >= 1e6) return n => n === 0 ? '0' : +(n / 1e6).toFixed(2) + ' ล้าน';
  if (max >= 1e4) return n => n === 0 ? '0' : +(n / 1e3).toFixed(1) + 'k';
  return n => n.toLocaleString('th-TH');
}
const short = n => axisFmt(n)(n);   // ใช้กับป้ายแท่งสูงสุดเดี่ยวๆ

let DATA = null, curYear = null;

fetch('/api/summary').then(r => r.json()).then(d => {
  DATA = d;
  if (!d.totals.count) { $('empty').style.display = ''; return; }
  $('content').style.display = '';
  renderTiles();
  const years = d.yearly.map(r => r.period);
  // เปิดมาให้ดูปีที่มีใบเยอะสุดก่อน -- ถ้าเลือกปีล่าสุดอัตโนมัติ บางทีเป็นปีที่เพิ่งเริ่ม
  // มีไม่กี่ใบ กราฟรายเดือนจะโล่งจนดูไม่ออกว่าระบบมีข้อมูลอยู่
  curYear = d.yearly.reduce((a, b) => (b.count > a.count ? b : a), d.yearly[0]).period;
  $('yearSel').innerHTML = years.map(y => `<option value="${y}">ปี ${y}</option>`).join('');
  $('yearSel').value = curYear;
  drawAll();
}).catch(() => {
  $('empty').style.display = '';
  $('empty').textContent = 'ติดต่อเซิร์ฟเวอร์ไม่ได้';
});

$('yearSel').addEventListener('change', e => { curYear = e.target.value; drawAll(); });
window.addEventListener('resize', () => { if (DATA) drawAll(); });
document.querySelectorAll('.toggle-table').forEach(b => b.addEventListener('click', () => {
  const t = $(b.dataset.for);
  t.classList.toggle('show');
  b.textContent = t.classList.contains('show') ? 'ซ่อนตาราง' : 'แสดงเป็นตาราง';
}));

function renderTiles() {
  const t = DATA.totals;
  const yrs = DATA.yearly.length;
  $('tiles').innerHTML = `
    <div class="tile"><div class="cap">ใบกำกับภาษีทั้งหมด</div><div class="val">${t.count.toLocaleString('th-TH')}</div><div class="sub">ใบ · ${yrs} ปี</div></div>
    <div class="tile"><div class="cap">ยอดรวมทั้งสิ้น</div><div class="val">${baht(t.grand_total)}</div><div class="sub">รวมภาษีแล้ว</div></div>
    <div class="tile"><div class="cap">ภาษีมูลค่าเพิ่มรวม</div><div class="val">${baht(t.vat)}</div><div class="sub">VAT</div></div>
    ${t.undated ? `<div class="tile warn"><div class="cap">อ่านวันที่ไม่ออก</div><div class="val">${t.undated}</div><div class="sub">ใบ · ไม่ถูกนับในกราฟ</div></div>` : ''}`;
}

function drawAll() {
  // ── รายปี ──
  const ys = DATA.yearly.map(r => ({ key: r.period, label: r.period, value: r.grand_total, count: r.count }));
  drawBars($('chartYear'), $('tipYear'), ys, curYear, k => { curYear = k; $('yearSel').value = k; drawAll(); });
  fillTable($('tblYear'), 'ปี', ys);

  // ── รายเดือนของปีที่เลือก (เติมเดือนที่ไม่มีใบเป็น 0 เพื่อให้เห็นช่องว่าง) ──
  const byM = Object.fromEntries(DATA.monthly.filter(r => r.period.startsWith(curYear + '-'))
    .map(r => [r.period.slice(5), r]));
  const ms = MONTHS.map((lbl, i) => {
    const k = String(i + 1).padStart(2, '0'), r = byM[k];
    return { key: k, label: lbl, value: r ? r.grand_total : 0, count: r ? r.count : 0 };
  });
  drawBars($('chartMonth'), $('tipMonth'), ms, null, null);
  fillTable($('tblMonth'), 'เดือน', ms);
  $('sub').textContent = `ยอดรวมรายเดือนและรายปี จากใบที่บันทึกไว้ ${DATA.totals.count.toLocaleString('th-TH')} ใบ`;
}

/**
 * กราฟแท่งชุดเดียว (ไม่ต้องมีคำอธิบายสี เพราะมีชุดเดียว หัวข้อบอกอยู่แล้ว)
 * selKey = แท่งที่กำลังเลือกอยู่ (ทำให้เด่น อันอื่นหรี่ลง), onPick = คลิกแท่งแล้วทำอะไร
 */
function drawBars(host, tip, data, selKey, onPick) {
  const W = host.clientWidth || 600;
  const H = 240, PAD_L = 54, PAD_R = 8, PAD_T = 18, PAD_B = 30;
  const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B;
  const max = Math.max(...data.map(d => d.value), 1);
  const ticks = niceTicks(max, 4);
  const top = ticks[ticks.length - 1];
  const y = v => PAD_T + innerH - (v / top) * innerH;

  const step = innerW / data.length;
  const bw = Math.min(46, step * 0.62);
  const peak = data.reduce((a, b) => (b.value > a.value ? b : a), data[0]);

  const svg = [`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`];

  // เส้นกริดแนวนอน + ป้ายแกน (จางไว้ ไม่ให้แย่งสายตาแท่งข้อมูล)
  const fmt = axisFmt(top);
  for (const t of ticks) {
    svg.push(`<line class="grid-line" x1="${PAD_L}" y1="${y(t)}" x2="${W - PAD_R}" y2="${y(t)}"/>`);
    svg.push(`<text class="tick-lbl" x="${PAD_L - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`);
  }
  svg.push(`<line class="axis-base" x1="${PAD_L}" y1="${y(0)}" x2="${W - PAD_R}" y2="${y(0)}"/>`);

  data.forEach((d, i) => {
    const cx = PAD_L + step * i + step / 2;
    const x = cx - bw / 2;
    const h = d.value > 0 ? Math.max(2, y(0) - y(d.value)) : 0;
    // ทุกแท่งสีเต็มเท่ากัน -- ตัวที่เลือกอยู่บอกด้วยขีดใต้แท่ง+ป้ายแกนเป็นสีน้ำเงิน
    // (ถ้าหรี่แท่งที่ไม่ได้เลือก กราฟรายปีจะจางจนอ่านตัวเลขเทียบกันไม่ได้)
    const sel = selKey && d.key === selKey;
    if (h > 0) {
      const r = Math.min(4, bw / 2, h);       // ปลายแท่งมนเล็กน้อย ฐานชิดเส้นศูนย์
      svg.push(`<path class="bar" d="M${x},${y(0)} L${x},${y(d.value) + r}`
        + ` Q${x},${y(d.value)} ${x + r},${y(d.value)} L${x + bw - r},${y(d.value)}`
        + ` Q${x + bw},${y(d.value)} ${x + bw},${y(d.value) + r} L${x + bw},${y(0)} Z"/>`);
    }
    if (sel) svg.push(`<rect class="sel-mark" x="${x}" y="${y(0) + 3}" width="${bw}" height="3" rx="1.5"/>`);
    // ป้ายตัวเลขเฉพาะแท่งสูงสุด (ไม่ติดทุกแท่ง จะรก)
    if (d === peak && d.value > 0) {
      svg.push(`<text class="peak-lbl" x="${cx}" y="${y(d.value) - 6}" text-anchor="middle">${fmt(d.value)}</text>`);
    }
    const on = selKey && d.key === selKey ? ' on' : '';
    svg.push(`<text class="cat-lbl${on}" x="${cx}" y="${H - 10}" text-anchor="middle">${d.label}</text>`);
    // พื้นที่รับเมาส์กว้างกว่าแท่งจริง กดง่ายบนมือถือ
    svg.push(`<rect class="bar-hit" x="${PAD_L + step * i}" y="${PAD_T}" width="${step}" height="${innerH}" data-i="${i}"/>`);
  });
  svg.push('</svg>');

  host.querySelectorAll('svg').forEach(el => el.remove());
  host.insertAdjacentHTML('afterbegin', svg.join(''));

  host.querySelectorAll('.bar-hit').forEach(hit => {
    const d = data[+hit.dataset.i];
    const cx = PAD_L + step * (+hit.dataset.i) + step / 2;
    hit.addEventListener('mouseenter', () => {
      tip.innerHTML = `<b>${d.label}</b><br>${baht(d.value)}<br>${d.count} ใบ`;
      tip.style.left = Math.min(Math.max(cx, 70), W - 70) + 'px';
      tip.style.top = (d.value > 0 ? y(d.value) : y(0)) - 10 + 'px';
      tip.classList.add('on');
    });
    hit.addEventListener('mouseleave', () => tip.classList.remove('on'));
    if (onPick) hit.addEventListener('click', () => onPick(d.key));
  });
}

/** ขั้นแกนที่ลงตัวอ่านง่าย (1, 2, 5 x 10^n) */
function niceTicks(max, n) {
  const raw = max / n;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}

function fillTable(tbl, head, data) {
  tbl.innerHTML = `<thead><tr><th>${head}</th><th>จำนวนใบ</th><th>ยอดรวม</th></tr></thead><tbody>`
    + data.map(d => `<tr><td>${d.label}</td><td>${d.count.toLocaleString('th-TH')}</td><td>${baht(d.value)}</td></tr>`).join('')
    + `</tbody><tfoot><tr><th>รวม</th><th>${data.reduce((s, d) => s + d.count, 0).toLocaleString('th-TH')}</th>`
    + `<th>${baht(data.reduce((s, d) => s + d.value, 0))}</th></tr></tfoot>`;
}
</script>
</body>
</html>
